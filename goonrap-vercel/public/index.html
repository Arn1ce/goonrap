<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09050f"><title>GOONRAP</title>
<style>
:root{--bg:#09050f;--fg:#fff;--mut:#a99fbd;--card:#ffffff14;--glass:#1a1226e8;--a:#8b5cf6;--a2:#ec4899}
[data-theme=light]{--bg:#f7f3fc;--fg:#18101f;--mut:#6d6480;--card:#0000000f;--glass:#fffffff0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:140px;overflow-x:hidden;transition:background .4s}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;opacity:.4;background:radial-gradient(circle,var(--a),transparent 62%);will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){top:-30vmax;left:-20vmax}
.blobs i:nth-child(2){top:20vmax;right:-30vmax;background:radial-gradient(circle,var(--a2),transparent 62%);opacity:.22;animation-duration:24s}
.blobs i:nth-child(3){bottom:-35vmax;left:10vmax;opacity:.2;animation-duration:30s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#scene{position:relative;z-index:1;max-width:1000px;margin:0 auto;isolation:isolate}
header,main{position:relative;z-index:1;max-width:none;margin:auto}
header{position:sticky;top:0;z-index:12;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);border-bottom:1px solid color-mix(in srgb,var(--fg) 7%,transparent);border-radius:0 0 18px 18px;animation:fade .8s both}
main{padding:8px 18px}
h1{font-size:28px;font-weight:800;letter-spacing:-1px}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0}
#prof{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ef4444,var(--a));font-weight:700;color:#fff;transition:transform .3s;box-shadow:0 0 0 0 var(--a);animation:pulse 3s 3}
#prof:hover{transform:rotate(20deg) scale(1.1)}
@keyframes pulse{70%{box-shadow:0 0 0 12px #0000}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.96)}}
main{padding:8px 18px}
h2{font-size:21px;margin:30px 0 14px;display:flex;align-items:center;gap:10px;animation:fade .8s both}
h2 b{font-size:12px;font-weight:600;background:var(--card);border-radius:99px;padding:3px 10px;color:var(--mut)}
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;padding:22px;background:var(--c,#2a1b3d);box-shadow:0 20px 60px color-mix(in srgb,var(--c,#8b5cf6) 45%,transparent);animation:rise .9s both;cursor:pointer}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 8s}

.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,#000c)}
.hero>div{position:relative;z-index:2;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;width:100%;gap:14px}
.hero h3{font-size:clamp(26px,7vw,44px);letter-spacing:-1.5px;line-height:1}
.hero p{opacity:.8;margin-top:8px;font-size:14px}
.hero .tag{display:inline-block;background:#fff3;border-radius:99px;padding:4px 12px;font-size:12px;margin-bottom:10px}
.pb{flex:none;width:64px;height:64px;border-radius:50%;background:#fff;color:#000;font-size:24px;transition:transform .2s;box-shadow:0 8px 30px #0008}
.pb:hover{transform:scale(1.12)}
.empty{border:2px dashed var(--card);border-radius:26px;padding:50px 20px;text-align:center;color:var(--mut);animation:rise .9s both}
.empty big{display:block;font-size:44px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.card{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;text-align:left;display:flex;align-items:flex-end;padding:12px;background:var(--c);border:0;color:inherit;font:inherit;cursor:pointer;outline:none;box-shadow:0 10px 26px #0005;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);contain:layout paint}
.card.new{animation:rise .7s calc(var(--i)*70ms) both}
.card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 40px color-mix(in srgb,var(--c) 50%,transparent)}
.card:active{transform:scale(.96)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover img{transform:scale(1.12)}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000c)}
.card .t{position:relative;z-index:2;color:#fff;font-weight:700;line-height:1.15;text-shadow:0 2px 8px #0008}
.card.on{outline:3px solid #fff;outline-offset:-3px}
.eq{position:absolute;top:10px;right:10px;z-index:3;display:none;gap:2px;align-items:flex-end;height:18px}
.card.on .eq{display:flex}
.eq i{width:4px;background:#fff;border-radius:2px;height:100%;animation:bar .8s ease-in-out infinite alternate;animation-play-state:paused}
body.pl .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes bar{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.eq i{transform-origin:bottom}
.cd{display:flex;gap:4px;position:absolute;top:10px;left:10px;right:10px;z-index:3}

.card.lock{cursor:default}.card.lock img{filter:blur(4px) brightness(.7)}
.card.lock:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff3 50%,transparent 70%);background-size:250% 100%;animation:shine 2.6s steps(26) infinite;z-index:2}

.srch{width:100%;padding:13px 16px;border-radius:14px;background:var(--card);border:0;color:var(--fg);font:inherit;margin-bottom:14px;transition:box-shadow .3s}

/* Admin controls are intentionally quiet until an administrator opens them. */
.track-tools{position:absolute;top:10px;right:10px;z-index:7;display:flex;align-items:flex-start}
.dots{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#09050fc9;color:#fff;border:1px solid #ffffff2c;box-shadow:0 5px 18px #0005;backdrop-filter:blur(10px);transition:transform .2s,background .2s}

.track-menu button:hover{background:var(--card)}
.track-menu button:active{transform:scale(.98)}
.track-menu .danger{color:#ff8b91}
.card .track-tools{top:8px;right:8px}
.hero>.track-tools{position:absolute;z-index:7;top:10px;right:10px;width:auto;align-items:flex-start;justify-content:flex-end}

.card .dots{width:32px;height:32px}
.confirm-overlay{position:fixed;inset:0;z-index:48;display:flex;align-items:center;justify-content:center;padding:20px;background:#000a;backdrop-filter:blur(9px);opacity:0;transition:opacity .2s}

.play{position:relative}.play svg{position:absolute;inset:0;margin:auto;width:42%;height:42%;transition:transform .45s cubic-bezier(.2,.9,.3,1.4),opacity .25s}

.pb{display:grid;place-items:center}
#wave{position:fixed;left:0;right:0;bottom:0;height:86px;pointer-events:none;z-index:4;opacity:0;transition:opacity .8s;overflow:hidden;mask-image:linear-gradient(transparent,#000 42%);-webkit-mask-image:linear-gradient(transparent,#000 42%)}

#wave svg{position:absolute;left:0;bottom:0;width:200%;height:100%;fill:var(--a);will-change:transform;animation:wv 9s linear infinite;filter:drop-shadow(0 0 12px var(--a))}
#wave .w1{opacity:.5}#wave .w2{opacity:.32;height:82%;animation-duration:14s;animation-direction:reverse}#wave .w3{opacity:.22;height:62%;animation-duration:6s}

:root{transition:--a .9s ease}
.card:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

@keyframes side-float{to{translate:0 18px;opacity:.25}}
@keyframes side-flow{to{stroke-dashoffset:-420}}
@media(min-width:1200px){.side-visuals{display:block}}

.play{width:46px;height:46px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:18px;transition:transform .2s}.play:active{transform:scale(.9)}

/* V3 player refinement: fixed viewport, YouTube-Music-inspired mobile layout, lighter effects */

#np .sc[data-k=p]::-webkit-scrollbar{display:none}

#np .npb{filter:none;transition:opacity .72s ease,transform .82s ease;}
#np .npb.an-flow{animation:none!important;}
